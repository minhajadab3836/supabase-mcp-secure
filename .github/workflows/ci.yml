name: CI Security Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: https://mock-ci-project.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: mock-ci-service-role-key-12345
      MCP_MODE: READ_ONLY
      ADMIN_TOKEN: secret-ci-admin-token-123

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck and Compile
        run: npm run build

      - name: Run Security Defense Suite
        run: npm test

      - name: Verify Tool Definitions & Schema Generation
        run: node -e "import('./dist/tools/index.js').then(m => console.log('Catalog loaded successfully:', m.toolsCatalog.length, 'tools registered.'))"
